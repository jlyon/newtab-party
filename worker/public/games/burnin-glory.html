<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Burnin' Glory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap" rel="stylesheet" />
<style>
  :root { --primary: #0a1628; --secondary: #aaff00; --bg: #f5e6c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1f0a; color: #e8e8e8;
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; }
  h1 { margin: 0; font-size: clamp(14px, 4vw, 22px); letter-spacing: 2px; font-weight: 800; color: #aaff00; }
  #hud { display: flex; gap: 14px; font-size: clamp(11px, 3vw, 13px); align-items: center; }
  #kmh { font-size: clamp(14px, 3.5vw, 17px); font-weight: 800; color: #aaff00; min-width: 80px; }
  #boosts { display: flex; gap: 4px; }
  .bpip { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #666; background: transparent; transition: background 0.15s; }
  .bpip.charged { background: #aaff00; border-color: #aaff00; }
  canvas { border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    width: min(95vw, calc((100dvh - 80px) * 0.621)); height: auto; display: block; }
  #controls { display: none; gap: 8px; max-width: 95vw; width: min(95vw, 420px); }
  body.touch #controls { display: flex; }
  @media (pointer: coarse) { canvas { width: min(95vw, calc((100dvh - 150px) * 0.621)); } }
  .btn { height: 56px; min-width: 48px; font-size: 22px; border: 2px solid #444;
    background: #1e1e1e; color: #ccc; cursor: pointer; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; user-select: none;
    -webkit-touch-callout: none; flex: 1; transition: background 0.1s; }
  .btn:active, .btn.held { background: #444; color: #fff; }
  #btn-boost { border-color: #aaff00; color: #aaff00; flex: 1.2; font-size: 18px; }
  #btn-boost:active, #btn-boost.held { background: #aaff00; color: #000; }
  #btn-boost.empty { opacity: 0.3; }
  #start-overlay {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.92); flex-direction: column;
    text-align: center; padding: 20px; z-index: 10;
  }
  #start-card { max-width: 420px; }
  #start-card h2 { color: #aaff00; font-size: clamp(22px,6vw,40px); margin: 0 0 8px; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 20px rgba(170,255,0,0.5); }
  #start-card .subtitle { color: #f5e6c8; font-size: clamp(12px,3vw,15px); margin: 0 0 10px; letter-spacing: 1px; font-style: italic; }
  #start-card p { color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.6; margin: 0 0 28px; }
  #start-btn {
    padding: 12px 36px; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    background: #aaff00; color: #000; border: none; cursor: pointer;
    border-radius: 6px; font-family: inherit; transition: opacity 0.15s;
  }
  #start-btn:hover { opacity: 0.85; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88); flex-direction: column; text-align: center; padding: 20px; }
  #overlay h2 { color: #aaff00; font-size: clamp(22px, 6vw, 36px); margin: 0 0 8px; letter-spacing: 2px; }
  #overlay p { color: #ccc; margin: 4px 0; font-size: clamp(12px, 3vw, 15px); }
  #overlay button { margin-top: 18px; padding: 12px 32px; font-size: clamp(14px, 3.5vw, 16px);
    background: #aaff00; color: #000; border: none; cursor: pointer; border-radius: 6px; letter-spacing: 1px; font-weight: 700; }

  /* ── Landing page (start screen) — themed redesign ────────────── */
  #start-overlay {
    background:
      radial-gradient(84% 68% at 50% 45%, rgba(0,0,0,0.5), rgba(0,0,0,0.34) 72%, rgba(0,0,0,0.62)),
      url('backgrounds/burnin-glory.jpg') center/cover no-repeat;
  }
  #start-card {
    max-width: 560px;
    background: rgba(6,14,6,0.6);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 18px; padding: 32px 32px 36px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  #start-card h2 {
    font-family: 'Racing Sans One', sans-serif;
    font-size: clamp(38px, 11vw, 88px); font-weight: 400;
    line-height: 0.98; letter-spacing: 2px; margin: 0 0 8px; color: #aaff00;
    text-shadow: 0 3px 34px rgba(0,0,0,0.85), 0 0 26px rgba(170,255,0,0.5);
  }
  #start-card .subtitle {
    color: #f5e6c8; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #start-card p {
    color: rgba(255,255,255,0.85); font-size: clamp(12px,3.4vw,15px);
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #start-btn {
    font-family: 'Racing Sans One', sans-serif;
    margin-top: 4px; padding: 15px 50px;
    font-size: clamp(16px,4vw,22px); letter-spacing: 2px; text-transform: uppercase;
    border: none; border-radius: 40px; cursor: pointer;
    color: #10100f; background: #aaff00;
    box-shadow: 0 12px 44px rgba(170,255,0,0.35);
    transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
  }
  #start-btn:hover { opacity: 1; transform: translateY(-2px) scale(1.04); box-shadow: 0 16px 54px rgba(170,255,0,0.5); }
</style>
</head>
<body>
<div id="wrap">
  <h1>BURNIN' GLORY</h1>
  <div id="hud">
    <span>🏎 Kart</span>
    <span id="kmh">0 KM/H</span>
    <span id="score">Score: 0</span>
    <span id="hi">Best: 0</span>
    <span id="boosts"><span class="bpip charged"></span><span class="bpip charged"></span><span class="bpip charged"></span></span>
  </div>
  <canvas id="game" width="360" height="580"></canvas>
  <div id="controls">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-boost">🌿 BOOST</button>
    <button class="btn" id="btn-right">▶</button>
  </div>
</div>
<div id="start-overlay">
  <div id="start-card">
    <h2>BURNIN' GLORY</h2>
    <div class="subtitle">Jungle Rally Championship</div>
    <p>← → to steer &nbsp;·&nbsp; Space or button to boost<br>The road sweeps deep into the jungle — stay out of the mud, overtake rivals, dodge the traffic!</p>
    <button id="start-btn">▶ Race</button>
  </div>
</div>
<div id="overlay">
  <h2 id="overTitle">CRASH!</h2>
  <p id="overMsg"></p>
  <p id="overScore"></p>
  <button id="restart">Race Again</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const hiEl    = document.getElementById('hi');
  const kmhEl   = document.getElementById('kmh');
  const boostPips = document.querySelectorAll('.bpip');
  const overlay  = document.getElementById('overlay');
  const overTitle = document.getElementById('overTitle');
  const overMsg   = document.getElementById('overMsg');
  const overScore = document.getElementById('overScore');
  const startOverlay = document.getElementById('start-overlay');
  function grabFocus(){ try{ window.focus(); }catch(e){} }
  window.addEventListener('load', grabFocus);
  window.addEventListener('pointerdown', grabFocus);
  window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });
  document.getElementById('start-btn').addEventListener('click', () => {
    grabFocus();
    startOverlay.style.display = 'none';
    reset(); requestAnimationFrame(loop);
  });
  const css = getComputedStyle(document.documentElement);
  const COL1 = css.getPropertyValue('--primary').trim();   // dark navy
  const COL2 = css.getPropertyValue('--secondary').trim(); // lime green
  const W = canvas.width, H = canvas.height;

  // ===== GAME-SPECIFIC SECTION =====
  const RIVAL_NAME  = 'jungle racers';
  const MILESTONE   = 1000;      // cosmetic milestone interval for the endless progress bar
  const BASE_SPEED  = 2.5;
  const TOP_SPEED   = 7;
  const STEER       = 4.5;
  const BOOST_SPEED = 1.8;
  const BOOST_MAX   = 3;
  const BOOST_DURATION = 110;
  const BOOST_RECHARGE = 360;
  const CRASH_MSG   = 'Wrecked by the ' + RIVAL_NAME + '. The jungle wins this round.';
  // Rival types (vs = world speed; hotshots chase from behind)
  const CAR_TYPES = [
    { w: 46, h: 74, vs: 1.0, pts: 25, col: '#8B4513' },                 // wide slow mud truck
    { w: 36, h: 60, vs: 2.2, pts: 50, col: COL2      },                 // lime rival kart
    { w: 30, h: 54, vs: 0,   pts: 80, col: '#cc2244', behind: true }    // hotshot from behind
  ];
  // ==================================

  // Smooth looping circuit (sum of sines — no kinks, closes every lap)
  const LAP = 5000;
  const TAU = Math.PI * 2;
  function offsetAt(d) {
    const t = TAU * (d / LAP);
    return 85 * Math.sin(t) + 55 * Math.sin(2 * t + 2.4) + 40 * Math.sin(3 * t + 0.6);
  }

  // Perspective projection: flat ground, camera above the kart
  const HY = 200, ZN = 120, ZV = 900;
  const ROAD_HW = 130, LANE_B = ROAD_HW / 3;
  function proj(z) {
    const s = ZN / (ZN + z);
    return { s, y: HY + (H - HY) * s };
  }

  const held = { left: false, right: false, boost: false };
  const keys = {};

  function holdBtn(id, key) {
    const el = document.getElementById(id);
    const dn = e => { e.preventDefault(); held[key] = true; el.classList.add('held'); };
    const up = e => { e.preventDefault(); held[key] = false; el.classList.remove('held'); };
    el.addEventListener('mousedown', dn); el.addEventListener('mouseup', up); el.addEventListener('mouseleave', up);
    el.addEventListener('touchstart', dn, { passive: false });
    el.addEventListener('touchend', up, { passive: false }); el.addEventListener('touchcancel', up, { passive: false });
  }
  holdBtn('btn-left', 'left'); holdBtn('btn-right', 'right'); holdBtn('btn-boost', 'boost');
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); held.boost = true; }
    if (e.key === 'Enter' && overlay.style.display === 'flex') document.getElementById('restart').click();
  });
  addEventListener('keyup', e => { keys[e.key] = false; if (e.key === ' ') held.boost = false; });

  // Swipe / drag steering on the canvas
  let dragX = null;
  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('touchstart', e => { dragX = canvasX(e.touches[0].clientX); }, { passive: true });
  canvas.addEventListener('touchmove',  e => { dragX = canvasX(e.touches[0].clientX); }, { passive: true });
  canvas.addEventListener('touchend',   () => { dragX = null; }, { passive: true });
  canvas.addEventListener('touchcancel',() => { dragX = null; }, { passive: true });

  let px, camX, spd, frame, score, hiScore = 0, running;
  let dashOff, worldDist, rivals, particles, popups, trees, treeAcc;
  let boostCharges, boostT, rechargeT;
  let boosting, nearMissStreak;
  let kmhDisplay, steerVis, wasOffroad;

  const CANOPY = ['#1a5c0a','#2a7a14','#0d4008','#3a8a20','#166010'];

  function spawnTree(d) {
    const side = Math.random() < 0.5 ? -1 : 1;
    trees.push({ d, rel: side * (ROAD_HW + 30 + Math.random() * 280),
      r: 14 + Math.random() * 22, col: CANOPY[Math.floor(Math.random() * CANOPY.length)] });
  }
  function initWorld() {
    trees = []; treeAcc = 0;
    for (let d = worldDist + 30; d < worldDist + ZV; d += 26) spawnTree(d);
  }

  function reset() {
    worldDist = 0;
    px = offsetAt(0); camX = px;
    spd = BASE_SPEED; frame = 0; score = 0; dashOff = 0;
    rivals = []; particles = []; popups = [];
    boostCharges = BOOST_MAX; boostT = 0; rechargeT = 0;
    boosting = false; nearMissStreak = 0; kmhDisplay = 60;
    steerVis = 0; wasOffroad = false;
    running = true;
    initWorld();
    overlay.style.display = 'none'; updateHud();
  }
  function updateHud() {
    scoreEl.textContent = 'Score: ' + score;
    hiEl.textContent = 'Best: ' + hiScore;
    kmhEl.textContent = Math.round(kmhDisplay) + ' KM/H';
    boostPips.forEach((p, i) => p.classList.toggle('charged', i < boostCharges));
    document.getElementById('btn-boost').classList.toggle('empty', boostCharges === 0 && !boosting);
  }
  // Normalize raw score so a strong endless run posts ~1000 (raw was ~5000-scale).
  const SCORE_SCALE = 0.2;
  let _hi = 0;
  function postHi(n) {
    const v = Math.round((Math.floor(n) || 0) * SCORE_SCALE);
    if (v > _hi) _hi = v;
    window.parent.postMessage({ highScore: v }, '*');
  }
  function endGame() {
    running = false;
    if (score > hiScore) hiScore = score;
    postHi(score);
    overTitle.textContent = 'WRECKED!';
    overMsg.textContent = CRASH_MSG;
    overScore.textContent = 'Score: ' + score + (score >= hiScore && score > 0 ? ' — new best!' : '  ·  Best: ' + hiScore);
    updateHud(); overlay.style.display = 'flex';
  }

  function addPopup(x, y, text, col) { popups.push({ x, y, text, col: col || '#fff', life: 50 }); }
  function addParticles(x, y, col, count, vScale) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU;
      const v = (0.5 + Math.random() * 1.5) * (vScale || 1);
      particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 1, life: 20 + Math.random()*20, col });
    }
  }

  function laneRel(lane) { return (lane - 1) * (ROAD_HW * 0.55); }

  function spawnRival() {
    const type = CAR_TYPES[Math.floor(Math.random() * CAR_TYPES.length)];
    const d = type.behind ? worldDist - 100 : worldDist + ZV + 60;
    rivals.push({ ...type, d, rel: laneRel(Math.floor(Math.random() * 3)) + (Math.random() - 0.5) * 24,
      prevDz: d - worldDist, done: false });
  }

  function step() {
    frame++;
    const wantBoost = held.boost;
    if (wantBoost && !boosting && boostCharges > 0) {
      boosting = true; boostT = BOOST_DURATION; boostCharges--;
      rechargeT = 0;
      addPopup(W / 2, H * 0.7, '🌿 BOOST!', COL2);
    }
    if (boosting) { boostT--; if (boostT <= 0) boosting = false; }
    if (boostCharges < BOOST_MAX) {
      rechargeT++;
      if (rechargeT >= BOOST_RECHARGE) { boostCharges++; rechargeT = 0; addPopup(W / 2, H * 0.8, 'BOOST READY', COL2); }
    }

    // Off-road = jungle mud
    const rc0 = offsetAt(worldDist);
    const offroad = Math.abs(px - rc0) > ROAD_HW - 16;
    if (offroad && !wasOffroad) addPopup(W / 2, H - 150, 'MUD!', '#b8935a');
    wasOffroad = offroad;

    let targetSpd = Math.min(TOP_SPEED, BASE_SPEED + frame * 0.001) * (boosting ? BOOST_SPEED : 1);
    if (offroad) targetSpd *= 0.45;
    spd += (targetSpd - spd) * 0.05;
    worldDist += spd;
    dashOff = (dashOff + spd) % 12600;
    kmhDisplay += (60 + spd * 22 - kmhDisplay) * 0.08;

    const psx = W / 2 + (px - camX), psy = H - 74;
    if (offroad && frame % 3 === 0) addParticles(psx, psy + 20, '#6b4a2e', 2, 1);

    // Steering
    let steer = 0;
    if (keys['ArrowLeft'] || keys['a'] || held.left)  steer -= 1;
    if (keys['ArrowRight'] || keys['d'] || held.right) steer += 1;
    if (tiltX !== 0 && steer === 0) steer = tiltX;
    if (dragX !== null && steer === 0) steer = Math.max(-1, Math.min(1, (dragX - W / 2) / 50));
    steerVis += (steer - steerVis) * 0.2;
    px += steer * STEER;
    px = Math.max(rc0 - ROAD_HW - 80, Math.min(rc0 + ROAD_HW + 80, px));
    camX += (px - camX) * 0.35;

    // Spawns
    if (frame % 110 === 0) spawnRival();
    treeAcc += spd;
    while (treeAcc > 26) { treeAcc -= 26; spawnTree(worldDist + ZV + 20); }

    // Move rivals
    for (const r of rivals) r.d += r.behind ? spd + 1.6 : r.vs;

    // Collisions, near misses, overtakes
    for (const r of rivals) {
      const dz = r.d - worldDist;
      const lat = offsetAt(r.d) + r.rel;
      const latDiff = Math.abs(px - lat);
      if (Math.abs(dz) < 30 && latDiff < (34 + r.w) / 2 - 4) {
        addParticles(psx, psy, COL2, 20, 3); endGame(); return;
      }
      if (!r._nearMissed && Math.abs(dz) < 44 && latDiff < (34 + r.w) / 2 + 12) {
        r._nearMissed = true; nearMissStreak++;
        const bonus = nearMissStreak * 10;
        score += bonus;
        addPopup(psx, psy - 40, 'CLOSE! +' + bonus, '#ffdd44');
        addParticles(psx, psy, '#ffdd44', 6, 1);
      }
      if (!r.done && !r.behind && r.prevDz >= -40 && dz < -40) {
        r.done = true;
        const bonus = r.pts * (boosting ? 2 : 1);
        score += bonus;
        addPopup(W / 2, H * 0.3, 'OVERTAKE +' + bonus, COL2);
        nearMissStreak = 0;
      }
      if (!r.done && r.behind && r.prevDz <= 40 && dz > 40) {
        r.done = true; score += 15;
        addPopup(W / 2, H * 0.3, 'DODGED +15', '#aaddff');
      }
      r.prevDz = dz;
    }
    rivals = rivals.filter(r => r.d > worldDist - 120 && r.d < worldDist + ZV + 140);
    trees = trees.filter(t => t.d > worldDist - 30);

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 1.2; p.life--; }
    popups = popups.filter(p => p.life > 0);

    score += Math.floor(spd * 0.08);
    updateHud();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // Draws a rally car centered at origin of the current transform.
  function carBody(w, h, col) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(3, 3, w/2, h/5, 0, 0, TAU); ctx.fill();

    ctx.fillStyle = col;
    rr(-w/2, -h/2, w, h, 5); ctx.fill();

    const gl = ctx.createLinearGradient(-w/2, -h/2, w/2, h/4);
    gl.addColorStop(0, 'rgba(255,255,255,0.28)');
    gl.addColorStop(0.45, 'rgba(255,255,255,0.06)');
    gl.addColorStop(1, 'rgba(0,0,0,0.12)');
    ctx.fillStyle = gl;
    rr(-w/2, -h/2, w, h, 5); ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(-w/2 + 5, -h/2 + 12, w - 10, h - 24);

    ctx.fillStyle = 'rgba(160,210,255,0.55)';
    ctx.fillRect(-w/2 + 6, -h/2 + 7, w - 12, h * 0.21);

    ctx.fillStyle = 'rgba(130,185,230,0.4)';
    ctx.fillRect(-w/2 + 7, h/2 - 7 - h * 0.18, w - 14, h * 0.18);

    ctx.fillStyle = '#1a1a1a';
    const ww = 5, wh = 11;
    for (const [lx, ly] of [[-w/2-3, -h/2+9], [w/2-2, -h/2+9], [-w/2-3, h/2-9-wh], [w/2-2, h/2-9-wh]]) {
      ctx.fillRect(lx, ly, ww, wh);
      ctx.fillStyle = '#3a3a3a'; ctx.fillRect(lx+1, ly+2, ww-2, 4); ctx.fillStyle = '#1a1a1a';
    }

    ctx.fillStyle = 'rgba(255,252,200,0.9)';
    ctx.fillRect(-w/2+4, -h/2+3, 5, 3); ctx.fillRect(w/2-9, -h/2+3, 5, 3);

    ctx.fillStyle = '#ff2200';
    ctx.fillRect(-w/2+4, h/2-4, 7, 3); ctx.fillRect(w/2-11, h/2-4, 7, 3);

    // Lime green racing stripe for the player (navy car)
    if (col === COL1) {
      ctx.fillStyle = 'rgba(170,255,0,0.7)';
      ctx.fillRect(-3, -h/2+4, 6, h-8);
    }
  }

  function drawCar(x, y, sc, w, h, col, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    if (angle) ctx.rotate(angle);
    carBody(w, h, col);
    ctx.restore();
  }

  function drawCanopyTree(t, x, y, sc) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const r = t.r;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(3, r * 0.5, r * 0.9, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(-r * 0.12, -r * 0.3, r * 0.24, r * 0.8);
    ctx.fillStyle = t.col;
    ctx.beginPath(); ctx.arc(0, -r * 0.7, r, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.6, -r * 0.3, r * 0.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.6, -r * 0.3, r * 0.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.95, r * 0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawHills() {
    const layers = [
      { k: 0.04, col: '#7ba86a', amp: 40, base: 80 },
      { k: 0.09, col: '#4a7a3a', amp: 60, base: 48 }
    ];
    const bend = offsetAt(worldDist + 500) - offsetAt(worldDist);
    for (const L of layers) {
      const shift = -(camX * L.k) - bend * L.k * 6;
      ctx.fillStyle = L.col;
      const period = 130;
      const start = -((shift % period) + period) % period - period;
      let n = Math.floor(shift / period);
      for (let x = start; x < W + period; x += period, n++) {
        const a = L.amp * (0.6 + 0.4 * Math.abs(Math.sin(n * 2.3)));
        ctx.beginPath();
        ctx.moveTo(x, HY);
        ctx.quadraticCurveTo(x + period / 2, HY - L.base - a, x + period, HY);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  function draw() {
    // Hazy jungle sky
    ctx.fillStyle = '#d9e6b0';
    ctx.fillRect(0, 0, W, HY);
    // Sun
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(W - 64, 52, 22, 0, TAU); ctx.fill();
    drawHills();

    // Ground + dirt road, one scanline at a time
    for (let y = HY + 1; y < H; y++) {
      const s = (y - HY) / (H - HY);
      const z = ZN * (1 / s - 1);
      const d = worldDist + z;
      // Jungle floor
      ctx.fillStyle = Math.floor(d / 80) % 2 ? '#1f5410' : '#1a4a0a';
      ctx.fillRect(0, y, W, 1);
      // Dirt road
      const cx = W / 2 + (offsetAt(d) - camX) * s;
      const hw = ROAD_HW * s;
      ctx.fillStyle = Math.floor(d / 60) % 2 ? '#443019' : '#4a3520';
      ctx.fillRect(cx - hw, y, hw * 2, 1);
      // Rumble strips at the edges
      const pw = Math.max(1.5, 9 * s);
      ctx.fillStyle = Math.floor(d / 26) % 2 ? '#cc1100' : '#f5e6c8';
      ctx.fillRect(cx - hw, y, pw, 1);
      ctx.fillRect(cx + hw - pw, y, pw, 1);
      // Edge shading
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(cx - hw + pw, y, Math.max(1, 3 * s), 1);
      ctx.fillRect(cx + hw - pw - Math.max(1, 3 * s), y, Math.max(1, 3 * s), 1);
      // Beige lane dashes
      if (((d % 42) + 42) % 42 < 26) {
        ctx.fillStyle = 'rgba(245,230,200,0.45)';
        const lw = Math.max(1, 2.4 * s);
        ctx.fillRect(cx - LANE_B * s - lw / 2, y, lw, 1);
        ctx.fillRect(cx + LANE_B * s - lw / 2, y, lw, 1);
      }
      // Lime center line
      if (((d % 60) + 60) % 60 < 36) {
        ctx.fillStyle = 'rgba(170,255,0,0.5)';
        ctx.fillRect(cx - Math.max(1, 3 * s) / 2, y, Math.max(1, 3 * s), 1);
      }
    }

    // Horizon haze
    const fog = ctx.createLinearGradient(0, HY, 0, HY + 70);
    fog.addColorStop(0, 'rgba(217,230,176,0.85)');
    fog.addColorStop(1, 'rgba(217,230,176,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, HY, W, 70);

    // Sprites, far to near
    const list = [];
    for (const t of trees)  list.push({ z: t.d - worldDist, kind: 't', o: t });
    for (const r of rivals) list.push({ z: r.d - worldDist, kind: 'r', o: r });
    list.sort((a, b) => b.z - a.z);

    for (const it of list) {
      if (it.z < -10 || it.z > ZV) continue;
      const pr = proj(Math.max(0, it.z));
      const lat = offsetAt(it.o.d) + it.o.rel;
      const sx = W / 2 + (lat - camX) * pr.s;
      if (it.kind === 't') drawCanopyTree(it.o, sx, pr.y, pr.s * 2.2);
      else drawCar(sx, pr.y, pr.s, it.o.w, it.o.h, it.o.col, 0);
    }

    // Incoming hotshot warning
    for (const r of rivals) {
      const dz = r.d - worldDist;
      if (r.behind && dz < -5 && dz > -160) {
        const lat = offsetAt(r.d) + r.rel;
        const wx = Math.max(14, Math.min(W - 14, W / 2 + (lat - camX)));
        ctx.fillStyle = '#e33';
        ctx.beginPath();
        ctx.moveTo(wx, H - 16); ctx.lineTo(wx - 8, H - 4); ctx.lineTo(wx + 8, H - 4);
        ctx.closePath(); ctx.fill();
      }
    }

    // Endless milestone bar on right edge
    const t = (score % MILESTONE) / MILESTONE;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W - 8, 0, 6, H);
    ctx.fillStyle = COL2;
    ctx.fillRect(W - 8, H * (1 - t), 6, H * t);

    const psx = W / 2 + (px - camX), psy = H - 74;

    // Tire marks
    if (spd > BASE_SPEED * 1.15) {
      const alpha = Math.min(0.35, (spd - BASE_SPEED * 1.15) / (TOP_SPEED - BASE_SPEED) * 0.35);
      ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
      const len = Math.min(60, spd * 6);
      ctx.fillRect(psx - 15, psy + 28, 5, len);
      ctx.fillRect(psx + 10, psy + 28, 5, len);
    }

    // Boost exhaust (lime flare)
    if (boosting) {
      for (let i = 0; i < 6; i++) {
        const fh = 8 + Math.random() * 24;
        const fw = 3 + Math.random() * 4;
        const fx = psx + (Math.random() - 0.5) * 22;
        ctx.globalAlpha = 0.5 + Math.random() * 0.45;
        const g = 150 + Math.floor(Math.random() * 105);
        ctx.fillStyle = 'rgb(' + Math.floor(g*0.6) + ',' + g + ',0)';
        ctx.beginPath(); ctx.ellipse(fx, psy + 32 + fh/2, fw/2, fh/2, 0, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Player kart (leans into the corners)
    drawCar(psx, psy, 1.05, 34, 58, COL1, steerVis * 0.16);

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Speed motion lines
    if (spd > BASE_SPEED * 1.4) {
      const intensity = Math.min(0.45, (spd - BASE_SPEED*1.4) / (TOP_SPEED - BASE_SPEED*1.4) * 0.45);
      ctx.strokeStyle = 'rgba(170,255,0,0.8)'; ctx.lineWidth = 1;
      for (let i = 0; i < 10; i++) {
        const lx = 20 + Math.random() * (W - 40);
        const ly = HY + Math.random() * (H - HY);
        const len = (12 + Math.random() * 36) * intensity * 2.5;
        ctx.globalAlpha = intensity * 0.8;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + len); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Score popups
    ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, p.life / 50);
      ctx.fillStyle = p.col;
      ctx.font = 'bold ' + Math.round(W * 0.042) + 'px system-ui';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function loop() { if (running) step(); draw(); requestAnimationFrame(loop); }
  document.getElementById('restart').addEventListener('click', () => { grabFocus(); reset(); });

  // Tilt support
  let tiltX = 0;
  function enableTilt() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') setupTilt(); }).catch(() => {});
    } else { setupTilt(); }
  }
  function setupTilt() {
    window.addEventListener('deviceorientation', e => {
      const g = e.gamma || 0;
      const DEAD = 8, MAX = 40;
      const abs = Math.abs(g);
      tiltX = abs < DEAD ? 0 : Math.sign(g) * Math.min((abs - DEAD) / (MAX - DEAD), 1);
    });
  }
  document.addEventListener('touchstart', enableTilt, { once: true });
})();
</script>
</body>
</html>
