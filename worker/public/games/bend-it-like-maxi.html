<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Bend it like Maxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  :root { --primary: #2ecc71; --secondary: #f5d442; --bg: #0a1420; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--primary);
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  /* instruction wording: keyboard on desktop, gestures on touch */
  .tc { display: none; } .kb { display: inline; }
  body.touch .tc { display: inline; } body.touch .kb { display: none; }
  @media (pointer: coarse) { .tc { display: inline; } .kb { display: none; } }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; }
  h1 { margin: 0; font-size: clamp(13px, 3.5vw, 20px); letter-spacing: 2px; }
  canvas { border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    width: min(95vw, calc((100dvh - 70px) * 600 / 420));
    height: auto; display: block; touch-action: none; cursor: crosshair; }
  /* touch controls: only shown once a real touch happens (body.touch) */
  #controls { display: none; gap: 8px; align-items: center; width: min(95vw - 48px, 720px); flex-wrap: wrap; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom); }
  body.touch #controls { display: flex; }
  body.touch canvas { width: min(95vw - 48px, calc((100dvh - 220px) * 600 / 420)); }   /* side margins keep drags away from the back-swipe edge */
  .ctrl-group { display: flex; gap: 5px; }
  .btn { padding: 8px 12px; height: 56px; min-width: 52px; font-size: clamp(11px, 3vw, 14px); border: 2px solid var(--primary);
    background: rgba(0,0,0,0.3); color: var(--primary); cursor: pointer; border-radius: 6px;
    user-select: none; -webkit-touch-callout: none; white-space: nowrap; transition: transform 0.08s ease; }
  .btn:hover { background: rgba(46,204,113,0.18); }
  .btn:active, .btn.held { background: var(--primary); color: var(--bg); transform: scale(0.96); }
  #btn-kick { border-color: var(--secondary); color: var(--secondary); padding: 8px 22px; font-weight: 700; }
  #btn-kick:active, #btn-kick.held { background: var(--secondary); color: var(--bg); }
  #power-bar-wrap { flex: 1; height: 16px; border: 2px solid var(--primary); border-radius: 4px; min-width: 60px; }
  #power-bar { height: 100%; width: 0%; background: var(--secondary); border-radius: 2px; }
  #start-overlay { position: fixed; inset: 0; display: flex; align-items: center;
    background: rgba(4,10,18,0.94); flex-direction: column; text-align: center; padding: 20px; z-index: 10; overflow-y: auto; touch-action: pan-y; }
  #start-card { max-width: 460px; margin: auto 0; }
  #start-card h2 { color: var(--primary); font-size: clamp(22px,6vw,36px); margin: 0 0 10px; letter-spacing: 2px; }
  #start-card p { color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.6; margin: 0 0 18px; font-style: italic; }
  .team-row { display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; margin: 0 0 22px; }
  .team-row label { color: rgba(255,255,255,0.6); font-size: 12px; display: block; margin-bottom: 4px; text-align: center; }
  select { background: #0f2233; color: #fff; border: 2px solid var(--primary); border-radius: 6px;
    padding: 10px 8px; font-size: 14px; font-family: inherit; max-width: 44vw; }
  .vs { color: var(--secondary); font-weight: 700; font-size: 18px; padding: 2px 0; }
  #start-btn { padding: 12px 36px; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    background: var(--primary); color: var(--bg); border: none; cursor: pointer; border-radius: 4px; font-family: inherit; }
  #start-btn:hover { opacity: 0.85; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); flex-direction: column; text-align: center; padding: 20px; z-index: 10; }
  #overlay h2 { color: var(--secondary); font-size: clamp(22px, 6vw, 36px); margin: 0 0 8px; }
  #overlay p { color: #fff; margin: 4px 0; font-size: clamp(12px, 3vw, 15px); max-width: 420px; }
  #overlay button { margin-top: 18px; padding: 14px 28px; min-height: 52px; font-size: clamp(14px, 3.5vw, 16px);
    background: var(--primary); color: var(--bg); border: none; cursor: pointer; border-radius: 4px; letter-spacing: 1px;
    user-select: none; -webkit-touch-callout: none; transition: transform 0.12s ease, filter 0.12s ease; }
  #overlay button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  #overlay button:active { transform: scale(0.97); }

  /* ── Landing page (start screen) — themed redesign ────────────── */
  #start-overlay {
    background:
      radial-gradient(84% 68% at 50% 44%, rgba(0,0,0,0.5), rgba(0,0,0,0.34) 72%, rgba(0,0,0,0.64)),
      linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('backgrounds/bend-it-like-maxi.jpg') center/cover no-repeat;
  }
  #start-card {
    max-width: 520px;
    background: rgba(6,12,20,0.6);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    border: 1px solid rgba(255,255,255,0.13); border-radius: 18px;
    padding: 32px 32px 36px; box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  #start-card h2 {
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    font-size: clamp(46px, 13vw, 104px); line-height: 0.92;
    letter-spacing: 2px; margin: 0 0 12px; color: #fff;
    text-shadow: 0 3px 34px rgba(0,0,0,0.85), 0 0 26px rgba(46,204,113,0.42);
  }
  #start-card p {
    color: rgba(255,255,255,0.9); font-style: normal; max-width: 40ch;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #start-btn {
    font-family: 'Bebas Neue', sans-serif;
    margin-top: 6px; padding: 15px 50px;
    font-size: clamp(16px,4vw,22px); letter-spacing: 3px; text-transform: uppercase;
    border: none; border-radius: 40px; cursor: pointer;
    color: var(--bg); background: var(--primary);
    box-shadow: 0 12px 44px rgba(0,0,0,0.5);
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
  }
  #start-btn:hover { opacity: 1; transform: translateY(-2px) scale(1.04); filter: brightness(1.08); }
  #start-btn:active { transform: scale(0.97); }
  #start-card img { display: block; width: min(82%, 400px); max-height: 34dvh; margin: 0 auto 12px; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  @media (max-height: 720px) {
    #start-card { padding: 16px 18px 20px; }
    #start-card img { max-height: 18dvh; margin-bottom: 6px; }
    #start-card p { margin-bottom: 10px; font-size: 12px; }
    .team-row { gap: 6px; margin-bottom: 12px; }
    select { padding: 8px 6px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>BEND IT LIKE MAXI</h1>
  <canvas id="game" width="600" height="420"></canvas>
  <div id="controls">
    <div class="ctrl-group">
      <button class="btn" id="btn-left">◀ Aim</button>
      <button class="btn" id="btn-right">Aim ▶</button>
    </div>
    <div class="ctrl-group">
      <button class="btn" id="btn-cleft">↶ Curve</button>
      <button class="btn" id="btn-cright">Curve ↷</button>
    </div>
    <button class="btn" id="btn-kick">⚽ KICK</button>
    <div id="power-bar-wrap"><div id="power-bar"></div></div>
  </div>
</div>
<div id="start-overlay">
  <div id="start-card">
    <img src="logos/bend-it-like-maxi.png" alt="Bend it like Maxi">
    <p>96th minute of the 2026 World Cup Final. 1–1. Ten free kicks stand between you and immortality.<br>
    <span class="kb">← → aim · A / D curve · Hold Space to charge · Release to kick</span><span class="tc">Drag the pitch or tap ◀ ▶ to aim · ↶ ↷ buttons curve it · Hold KICK to charge, release to shoot</span></p>
    <div class="team-row">
      <div><label>Your nation</label><select id="sel-my"></select></div>
      <div class="vs">VS</div>
      <div><label>Their nation</label><select id="sel-op"></select></div>
    </div>
    <button id="start-btn">▶ Take the kick</button>
  </div>
</div>
<div id="overlay">
  <h2 id="overTitle"></h2>
  <p id="overScore" style="color:var(--secondary);font-size:clamp(18px,5vw,26px);font-weight:700;margin:6px 0 4px"></p>
  <p id="overMsg"></p>
  <button id="restart">Rewrite history</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const powerBar = document.getElementById('power-bar');
  const overlay = document.getElementById('overlay');
  const overTitle = document.getElementById('overTitle');
  const overMsg = document.getElementById('overMsg');
  const overScore = document.getElementById('overScore');
  const startOverlay = document.getElementById('start-overlay');
  const W = 600, H = 420;
  // Crisp at any devicePixelRatio: logical W/H for all game math, backing store = CSS size x DPR.
  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssW = canvas.getBoundingClientRect().width || W;
    const bw = Math.max(1, Math.round(cssW * dpr)), bh = Math.max(1, Math.round(cssW * (H / W) * dpr));
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  fitCanvas();
  addEventListener('resize', fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitCanvas)).observe(canvas);

  // reveal touch controls on the first real touch; also arm the back-swipe guard so a stray edge swipe stays on the page
  window.addEventListener('touchstart', () => {
    document.body.classList.add('touch'); fitCanvas();
    try { history.pushState(null, '', location.href); } catch (e) {}
  }, { once: true, passive: true });
  window.addEventListener('popstate', () => { try { history.pushState(null, '', location.href); } catch (e) {} });
  const isTouch = () => document.body.classList.contains('touch');
  function grabFocus() { try { window.focus(); } catch (e) {} }
  grabFocus(); addEventListener('pointerdown', grabFocus);

  let _hi = 0;   // in-game "best" readout only
  // Posts the run's final score, exactly as shown on screen. Always posts (every game end).
  function postHi(n) {
    n = Math.max(0, Math.round(Number(n) || 0));
    if (n > _hi) _hi = n;
    try { window.parent.postMessage({ highScore: n }, '*'); } catch (e) {}
  }

  // ===== GAME-SPECIFIC SECTION =====
  const TOTAL_KICKS = 10;
  // All 48 nations at the 2026 World Cup
  const TEAMS = [
    { id: 'ALG', name: 'Algeria', flag: '🇩🇿', c1: '#F4F4F4', c2: '#006233' },
    { id: 'ARG', name: 'Argentina', flag: '🇦🇷', c1: '#75AADB', c2: '#FFFFFF' },
    { id: 'AUS', name: 'Australia', flag: '🇦🇺', c1: '#FFB81C', c2: '#00843D' },
    { id: 'AUT', name: 'Austria', flag: '🇦🇹', c1: '#EF3340', c2: '#FFFFFF' },
    { id: 'BEL', name: 'Belgium', flag: '🇧🇪', c1: '#E30613', c2: '#000000' },
    { id: 'BIH', name: 'Bosnia and Herzegovina', flag: '🇧🇦', c1: '#002F6C', c2: '#FFCC00' },
    { id: 'BRA', name: 'Brazil', flag: '🇧🇷', c1: '#FFDC02', c2: '#009C3B' },
    { id: 'CPV', name: 'Cabo Verde', flag: '🇨🇻', c1: '#003893', c2: '#CF2027' },
    { id: 'CAN', name: 'Canada', flag: '🇨🇦', c1: '#D80621', c2: '#FFFFFF' },
    { id: 'COL', name: 'Colombia', flag: '🇨🇴', c1: '#FCD116', c2: '#003893' },
    { id: 'CIV', name: "Côte d'Ivoire", flag: '🇨🇮', c1: '#FF8200', c2: '#009A44' },
    { id: 'CRO', name: 'Croatia', flag: '🇭🇷', c1: '#E73439', c2: '#FFFFFF' },
    { id: 'CUW', name: 'Curaçao', flag: '🇨🇼', c1: '#002B7F', c2: '#F9E814' },
    { id: 'CZE', name: 'Czechia', flag: '🇨🇿', c1: '#D7141A', c2: '#11457E' },
    { id: 'COD', name: 'DR Congo', flag: '🇨🇩', c1: '#007FFF', c2: '#F7D618' },
    { id: 'ECU', name: 'Ecuador', flag: '🇪🇨', c1: '#FFDD00', c2: '#034EA2' },
    { id: 'EGY', name: 'Egypt', flag: '🇪🇬', c1: '#CE1126', c2: '#000000' },
    { id: 'ENG', name: 'England', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', c1: '#F4F4F4', c2: '#CE1124' },
    { id: 'FRA', name: 'France', flag: '🇫🇷', c1: '#21304E', c2: '#E1000F' },
    { id: 'GER', name: 'Germany', flag: '🇩🇪', c1: '#EDEDED', c2: '#000000' },
    { id: 'GHA', name: 'Ghana', flag: '🇬🇭', c1: '#F4F4F4', c2: '#CE1126' },
    { id: 'HAI', name: 'Haiti', flag: '🇭🇹', c1: '#00209F', c2: '#D21034' },
    { id: 'IRN', name: 'Iran', flag: '🇮🇷', c1: '#F4F4F4', c2: '#DA0000' },
    { id: 'IRQ', name: 'Iraq', flag: '🇮🇶', c1: '#007A3D', c2: '#FFFFFF' },
    { id: 'JPN', name: 'Japan', flag: '🇯🇵', c1: '#143C8C', c2: '#FFFFFF' },
    { id: 'JOR', name: 'Jordan', flag: '🇯🇴', c1: '#F4F4F4', c2: '#CE1126' },
    { id: 'MEX', name: 'Mexico', flag: '🇲🇽', c1: '#006847', c2: '#FFFFFF' },
    { id: 'MAR', name: 'Morocco', flag: '🇲🇦', c1: '#C1272D', c2: '#006233' },
    { id: 'NED', name: 'Netherlands', flag: '🇳🇱', c1: '#F36C21', c2: '#FFFFFF' },
    { id: 'NZL', name: 'New Zealand', flag: '🇳🇿', c1: '#F4F4F4', c2: '#000000' },
    { id: 'NOR', name: 'Norway', flag: '🇳🇴', c1: '#C8102E', c2: '#00205B' },
    { id: 'PAN', name: 'Panama', flag: '🇵🇦', c1: '#DA121A', c2: '#FFFFFF' },
    { id: 'PAR', name: 'Paraguay', flag: '🇵🇾', c1: '#DA121A', c2: '#F4F4F4' },
    { id: 'POR', name: 'Portugal', flag: '🇵🇹', c1: '#B01717', c2: '#046A38' },
    { id: 'QAT', name: 'Qatar', flag: '🇶🇦', c1: '#8A1538', c2: '#FFFFFF' },
    { id: 'KSA', name: 'Saudi Arabia', flag: '🇸🇦', c1: '#006C35', c2: '#FFFFFF' },
    { id: 'SCO', name: 'Scotland', flag: '🏴󠁧󠁢󠁳󠁣󠁴󠁿', c1: '#003078', c2: '#FFFFFF' },
    { id: 'SEN', name: 'Senegal', flag: '🇸🇳', c1: '#F4F4F4', c2: '#00853F' },
    { id: 'RSA', name: 'South Africa', flag: '🇿🇦', c1: '#FFB612', c2: '#007A4D' },
    { id: 'KOR', name: 'South Korea', flag: '🇰🇷', c1: '#CD2E3A', c2: '#000000' },
    { id: 'ESP', name: 'Spain', flag: '🇪🇸', c1: '#C60B1E', c2: '#FFC400' },
    { id: 'SWE', name: 'Sweden', flag: '🇸🇪', c1: '#FFCD00', c2: '#004B87' },
    { id: 'SUI', name: 'Switzerland', flag: '🇨🇭', c1: '#D52B1E', c2: '#FFFFFF' },
    { id: 'TUN', name: 'Tunisia', flag: '🇹🇳', c1: '#E70013', c2: '#FFFFFF' },
    { id: 'TUR', name: 'Türkiye', flag: '🇹🇷', c1: '#E30A17', c2: '#FFFFFF' },
    { id: 'URU', name: 'Uruguay', flag: '🇺🇾', c1: '#7BAFD4', c2: '#000000' },
    { id: 'USA', name: 'USA', flag: '🇺🇸', c1: '#F4F4F4', c2: '#002868' },
    { id: 'UZB', name: 'Uzbekistan', flag: '🇺🇿', c1: '#F4F4F4', c2: '#0099B5' },
  ];
  const PRE = [
    "96th minute. 1–1. The whole planet is watching you, Maxi.",
    "The keeper is screaming at his wall. They look terrified. Good.",
    "Your nan back home has covered her eyes. No pressure.",
    "The commentators have gone completely silent. That's never good.",
    "Somewhere in the stands, a single vuvuzela believes in you.",
    "Your manager is chewing his fourth piece of gum this minute.",
    "The wall is holding hands. Adorable. Ruin their night.",
    "Deep breath. Twenty years of practice for this exact moment.",
    "The keeper just spat on his gloves. Disgusting. Punish him.",
  ];
  const GOAL_MSG = [
    "GOOOOOOOOAL! ABSOLUTE SCENES IN THE STADIUM!",
    "MAXI, YOU MAGNIFICENT LEGEND! IT'S IN!",
    "THE NET BULGES! Grown adults are crying everywhere!",
    "TOP BINS! THE KEEPER NEVER EVEN MOVED!",
    "IT BENDS... IT DIPS... IT'S GLORIOUS!",
  ];
  const SAVE_MSG = [
    "SAVED! The keeper flies like he owes gravity money!",
    "Fingertips! Millimeters from glory!",
    "The keeper got a glove to it. He's celebrating like HE scored.",
  ];
  const WALL_MSG = [
    "OFF THE WALL! Straight into a defender's face!",
    "Blocked! The wall took it in the ribs and loved it!",
    "The wall eats it. They're high-fiving. Make them regret that.",
  ];
  const OVER_MSG = [
    "OVER THE BAR! Row Z! A fan caught it one-handed!",
    "Sky-high! The ball has left the stadium. Possibly the country.",
  ];
  const WIDE_MSG = [
    "WIDE! The corner flag was never the target, Maxi!",
    "It curls... and keeps curling... past the post. Agony.",
  ];
  const POST_MSG = [
    "OFF THE WOODWORK! The entire stadium just gasped!",
    "CLANG! The post is still shaking. So is everyone else.",
  ];
  const UNDER_MSG = [
    "UNDER THE WALL! They all jumped! Filthy. Disrespectful. Beautiful.",
  ];
  // ==================================

  // perspective helpers: z=0 at ball spot, z=1 at goal line
  // spotX = lateral offset of the kick spot, distF = distance factor (1 ≈ 24m)
  let spotX = 0, distF = 1, wallZ = 0.38, pEnd = 0.62, goalY = 170;
  const groundY = z => 392 - (392 - goalY) * z;
  const persp = z => 1 - (1 - pEnd) * z;
  const CX = 300, POST_X = 118, BAR_H = 135;
  const BEND = 55;
  // world x (goal-plane units, 0 = goal center) -> screen x; camera sits behind the ball
  const sx = (wx, z) => CX + (wx - spotX * (1 - z * 0.5)) * persp(z);

  const teamIdx = id => TEAMS.findIndex(t => t.id === id);
  let my = TEAMS[teamIdx('ARG')], op = TEAMS[teamIdx('FRA')], keeperKit = '#c8d419';
  const YELLOWISH = ['#FFDC02', '#FCD116', '#FFCD00', '#FFB81C', '#FFB612', '#FFDD00', '#F7D618', '#F9E814'];
  let kick, score, goals, phase, aim, curve, power, charging;
  let ball, loft, gxFinal, wallN, jumped, guessed, wallChecked, diveX, wind;
  let resultTimer, comment, clockS, tick = 0, flashT = 0, resultBall = null;   // tick: frame counter for ambient animation (advanced in step())
  let goalAnim = 0, netBall = null, confetti = [], splash = null;
  let popups = [], shake = 0;   // score pop-ups + brief screen shake (stepped in step(), read in draw())

  const selMy = document.getElementById('sel-my'), selOp = document.getElementById('sel-op');
  TEAMS.forEach((t, i) => {
    selMy.add(new Option(t.flag + ' ' + t.name, i));
    selOp.add(new Option(t.flag + ' ' + t.name, i));
  });
  selMy.value = teamIdx('ARG'); selOp.value = teamIdx('FRA');

  let loopStarted = false;
  function startGame() {
    my = TEAMS[+selMy.value]; op = TEAMS[+selOp.value];
    keeperKit = YELLOWISH.includes(op.c1) ? '#FF5CA8' : '#c8d419';
    startOverlay.style.display = 'none';
    grabFocus();
    reset();
    if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }   // loop started exactly once per page load
  }
  document.getElementById('start-btn').addEventListener('click', startGame);

  function reset() {
    kick = 1; score = 0; goals = 0; clockS = 318;
    overlay.style.display = 'none';
    setupKick();
  }

  function setupKick() {
    phase = 'aim'; aim = 0; curve = 0; power = 0; charging = false;
    ball = null; resultBall = null; wallChecked = false;
    netBall = null; goalAnim = 0; confetti = []; splash = null; popups = [];
    if (kick === 1) { spotX = 0; distF = 1; }
    else {
      spotX = Math.random() < 0.3 ? 0 : (Math.random() * 2 - 1) * 90;
      distF = 0.8 + Math.random() * 0.45;
    }
    pEnd = Math.min(0.8, Math.max(0.5, 0.62 / distF));
    goalY = 392 - 222 * (0.85 + 0.15 * distF);
    wallZ = 9.15 / (24 * distF);
    aim = spotX * 0.3;
    wallN = 4 + (kick >= 4 ? 1 : 0) + (kick >= 8 ? 1 : 0);
    wind = kick >= 5 ? (Math.random() * 2 - 1) * (kick - 4) * 4 * distF : 0;
    comment = kick === TOTAL_KICKS ? "THE LAST KICK OF THE WORLD CUP FINAL. THIS IS IT." :
      PRE[Math.floor(Math.random() * PRE.length)];
  }

  // controls
  const held = { left: false, right: false, cleft: false, cright: false, fire: false };
  function holdBtn(id, key) {
    const el = document.getElementById(id);
    const dn = e => { e.preventDefault(); held[key] = true; el.classList.add('held'); };
    const up = e => { e.preventDefault(); held[key] = false; el.classList.remove('held'); if (key === 'fire') releaseKick(); };
    el.addEventListener('mousedown', dn); el.addEventListener('mouseup', up); el.addEventListener('mouseleave', up);
    el.addEventListener('touchstart', dn, { passive: false });

  // Crowd: two pre-rendered variants (same people, different brightness) cross-faded for a slow shimmer; team colours sprinkled in.

  // --- players

    stand: {},

    kick: { kneeL: [-0.1, -0.26], ankL: [-0.12, -0.03], kneeR: [0.18, -0.38], ankR: [0.36, -0.32], elL: [-0.31, -0.82], hdL: [-0.46, -0.92], elR: [0.25, -0.62], hdR: [0.32, -0.5] },
    wallJump: { kneeL: [-0.13, -0.3], kneeR: [0.13, -0.3], ankL: [-0.09, -0.13], ankR: [0.09, -0.13], elL: [-0.19, -0.6], elR: [0.19, -0.6], hdL: [-0.05, -0.49], hdR: [0.05, -0.49] },
    set: { kneeL: [-0.16, -0.24], kneeR: [0.16, -0.24], ankL: [-0.2, -0.03], ankR: [0.2, -0.03], elL: [-0.28, -0.6], elR: [0.28, -0.6], hdL: [-0.34, -0.47], hdR: [0.34, -0.47] },
    stretch: { kneeL: [-0.08, -0.26], ankL: [-0.16, -0.03], kneeR: [0.17, -0.3], ankR: [0.13, -0.15], elL: [-0.21, -0.92], elR: [0.21, -0.92], hdL: [-0.27, -1.1], hdR: [0.27, -1.1] },

  // kind: 'wall' | 'keeper' | 'kicker' (the kicker is seen from behind). pose: a key of POSES. num: shirt number or ''.
  function drawFigure(x, gy, s, jersey, shorts, jump, dive, kind, tone, pose, num, hairIdx) {
    const h = 65 * s, skin = tone || '#c68642', J = Object.assign({}, BASE, POSES[pose] || {});
    const keeper = kind === 'keeper', back = kind === 'kicker', hair = HAIRS[(hairIdx || 0) % HAIRS.length];
    const lw = Math.max(2, 3.4 * s);

    for (const [hip, knee, ank] of [[J.hipL, J.kneeL, J.ankL], [J.hipR, J.kneeR, J.ankR]]) {   // thigh, shin, sock, boot

    ctx.lineTo(0, -0.37 * h); ctx.lineTo(-0.02 * h, -0.33 * h); ctx.lineTo(-0.17 * h, -0.33 * h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
    ctx.moveTo(0.04 * h, -0.5 * h); ctx.lineTo(0.15 * h, -0.5 * h); ctx.lineTo(0.17 * h, -0.33 * h); ctx.lineTo(0.04 * h, -0.33 * h); ctx.closePath(); ctx.fill();

    torso(); ctx.fillStyle = jersey; ctx.fill();                                                  // jersey with cylindrical shading
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.moveTo(0.05 * h, -0.76 * h); ctx.lineTo(0.17 * h, -0.76 * h); ctx.lineTo(0.14 * h, -0.48 * h); ctx.lineTo(0.04 * h, -0.48 * h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.moveTo(-0.17 * h, -0.76 * h); ctx.lineTo(-0.09 * h, -0.76 * h); ctx.lineTo(-0.07 * h, -0.48 * h); ctx.lineTo(-0.14 * h, -0.48 * h); ctx.closePath(); ctx.fill();

  function drawBallAt(x, y, r, rot) {

  }
  // soft drop shadow on the grass; h = height above ground in screen px
  function ballShadow(x, gy, h, s) {

    ctx.globalAlpha = Math.max(0.15, 0.6 - h * 0.004);
    ctx.fillStyle = ballShadowG; ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(Math.sin(shake * 23.7) * shake * 0.6, Math.cos(shake * 17.3) * shake * 0.4);
    const s1 = persp(1), gY = groundY(1);
    const pl = sx(-POST_X, 1), pr = sx(POST_X, 1), barY = gY - BAR_H * s1;

    // --- scenery: cached pitch, static stands, crowd (shimmer normally; bobbing slices + warm pulse on a goal)
    ctx.drawImage(getPitch(), 0, 0, W, H);
    ctx.drawImage(stadiumL, 0, 0, W, HORIZON);
    const cr = getCrowd();
    if (goalAnim > 0) {
      const amp = Math.min(1, goalAnim / 40);
      for (let i = 0; i < 12; i++) {
        const off = 2.5 * Math.max(0, Math.sin(tick * 0.35 + i * 0.9)) * amp;
        ctx.drawImage(cr[0], i * 50 * RS, 0, 50 * RS, HORIZON * RS, i * 50, -off, 50, HORIZON);
      }
      ctx.fillStyle = 'rgba(255,235,190,' + (0.16 * (goalAnim / 165) * (0.5 + 0.5 * Math.sin(tick * 0.5))).toFixed(3) + ')';
      ctx.fillRect(0, 26, W, 108);
    } else {
      ctx.drawImage(cr[0], 0, 0, W, HORIZON);
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(tick * 0.045); ctx.drawImage(cr[1], 0, 0, W, HORIZON); ctx.globalAlpha = 1;
    }
    const nFlash = goalAnim > 0 ? 7 : (hash(tick) < 0.12 ? 1 : 0);   // camera flashes in the stands
    ctx.fillStyle = '#fff';
    for (let i = 0; i < nFlash; i++) ctx.fillRect(hash(tick * 7 + i * 13) * W, 28 + hash(tick * 3 + i * 29) * 104, 3, 3);
    ctx.drawImage(lightsL, 0, 0, W, H);
    for (const c of confetti) { const w = 1.5 + 3 * Math.abs(Math.cos(c.sway)); ctx.fillStyle = c.c; ctx.fillRect(c.x - w / 2, c.y, w, 5); }

    // --- goal: net as a perspective mesh (back panel, sides, roof) with sag, rippling where the ball hit it
    const zb = 1 + 1.5 / (24 * distF), sb = persp(zb), gYb = groundY(zb), barYb = gYb - BAR_H * sb * 0.88;
    const plb = sx(-POST_X, zb), prb = sx(POST_X, zb);
    const bulge = netBall && goalAnim > 0 ? 11 * (goalAnim / 165) : 0, nAge = 165 - goalAnim;
    const disp = (x, y) => {
      if (!bulge) return [x, y];
      const dx = x - netBall.x, dy = y - netBall.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d > 46) return [x, y];

    }

    }
    for (let j = 0; j <= 6; j++) {

      let p = disp(plb, yb); ctx.moveTo(pl, yf); ctx.lineTo(p[0], p[1]);
      p = disp(prb, yb); ctx.moveTo(pr, yf); ctx.lineTo(p[0], p[1]);
    }
    for (let i = 0; i <= NV; i++) { const p = disp(plb + (prb - plb) * i / NV, barYb); ctx.moveTo(pl + (pr - pl) * i / NV, barY); ctx.lineTo(p[0], p[1]); }
    for (let k = 1; k <= 2; k++) {
      const t = k / 3, xl = pl + (plb - pl) * t, xr = pr + (prb - pr) * t, yt = barY + (barYb - barY) * t, yg = gY + (gYb - gY) * t;
      ctx.moveTo(xl, yt); ctx.lineTo(xl, yg); ctx.moveTo(xr, yt); ctx.lineTo(xr, yg); ctx.moveTo(xl, yt); ctx.lineTo(xr, yt);
    }
    ctx.stroke();
    // posts and bar: rounded, shaded, with shadows on the grass
    const pw = Math.max(3.5, 7 * s1);

      if (goalAnim > 137) {
        ctx.strokeStyle = 'rgba(255,255,255,' + ((goalAnim - 137) / 28) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(netBall.x, netBall.y, (165 - goalAnim) * 1.4 + 6, 0, Math.PI * 2); ctx.stroke();

    // --- ball: faint path arc, drop shadow, motion trail, spin streaks, rotating pentagon ball
    const ballDraw = () => {
      if (ball) {
        const z = ball.z, s = persp(z), h = pathH(z), bx = sx(pathX(z), z), by = groundY(z) - h * s, r = 7 * Math.max(0.45, s);
        ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.2; ctx.beginPath();
        for (let i = 0; i <= 16; i++) { const zz = z * i / 16, p = persp(zz), x = sx(pathX(zz), zz), y = groundY(zz) - pathH(zz) * p; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

        ballShadow(sx(pathX(z), z), groundY(z), h * s, s);
        ctx.fillStyle = '#fff';
        for (let k = 5; k >= 1; k--) {

          for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.5 - i * 0.13; ctx.beginPath(); ctx.arc(bx, by, r * (1.55 + i * 0.4), base - 0.55 + wob, base + 0.55 + wob); ctx.stroke(); }

    // --- wall lines up between the ball spot and the goal center
    const sw = persp(wallZ), wgy = groundY(wallZ), wallCX = spotX * (1 - wallZ);

    for (let i = 0; i < wallN; i++) {
      const wx = sx(wallCX + (i - (wallN - 1) / 2) * 26, wallZ);
      drawFigure(wx, wgy, sw, op.c1, op.c2 === '#FFFFFF' ? '#222' : op.c2, wjump, 0, 'wall', SKINS[i % SKINS.length], wjump > 2 ? 'wallJump' : 'stand', '', i);
    }

    if (!(ball && ball.z > wallZ)) ballDraw();
    if (!ball && !resultBall && phase === 'aim') { ballShadow(CX, 390, 0, 1); drawBallAt(CX, 388, 7, aim * 0.02); }

    // --- Maxi: addressing the ball, leaning into the run-up as the power charges, then the follow-through
    const myShorts = my.c2 === '#FFFFFF' ? '#222' : my.c2;
    if (phase === 'aim') {
      drawFigure(CX - 42 - power * 0.18, 396, 1, my.c1, myShorts, 0, -0.08 - power * 0.0025, 'kicker', '#e0ac69', charging ? 'charge' : 'stand', '10', 0);
    } else if (phase === 'flight' && ball && ball.z < 0.2) {
      const t = ball.z / 0.2;
      drawFigure(CX - 24 - 10 * (1 - t), 396, 1, my.c1, myShorts, 2 * Math.sin(t * Math.PI), -0.3 + t * 0.15, 'kicker', '#e0ac69', 'kick', '10', 0);
    }

    // --- aim preview: trajectory dots with ground shadows, gold target on the goal line
    if (phase === 'aim') {
      const prevLoft = Math.pow(Math.max(power, 30) / 100, 1.15) * 170;
      const savedLoft = loft; loft = prevLoft;
      for (let z = 0.05; z <= wallZ * 0.8; z += wallZ * 0.13) {
        const s = persp(z), x = sx(pathX(z), z);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, groundY(z), 2.4, 1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(x, groundY(z) - pathH(z) * s, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      loft = savedLoft;
      const tx = sx(aim, 1);
      ctx.fillStyle = 'rgba(245,212,66,0.18)'; ctx.beginPath(); ctx.arc(tx, gY - 4, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f5d442'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tx, gY - 4, 6.5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx - 10, gY - 4); ctx.lineTo(tx + 10, gY - 4); ctx.moveTo(tx, gY - 14); ctx.lineTo(tx, gY + 6); ctx.stroke();
    }

    // --- impact effects: sparks off the woodwork, a burst off the keeper's gloves, dust off the wall
    if (splash && splash.t > 120 && (splash.text === 'OFF THE POST!' || splash.text === 'SAVED!' || splash.text === 'BLOCKED!')) {
      const age = 165 - splash.t;
      let ix, iy;
      if (splash.text === 'BLOCKED!') { ix = sx(pathX(wallZ), wallZ); iy = groundY(wallZ) - pathH(wallZ) * persp(wallZ); }
      else { ix = sx(Math.max(-POST_X, Math.min(POST_X, gxFinal)), 1); iy = gY - Math.min(pathH(1), BAR_H) * s1; }
      ctx.globalAlpha = Math.max(0, 1 - age / 40);
      if (splash.text === 'OFF THE POST!') {
        ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let i = 0; i < 12; i++) {
          const a = hash(i + 1) * Math.PI * 2, len = 6 + age * (0.9 + hash(i + 40) * 1.4);
          ctx.strokeStyle = i & 1 ? '#f5d442' : '#fff';
          ctx.beginPath(); ctx.moveTo(ix + Math.cos(a) * len * 0.45, iy + Math.sin(a) * len * 0.45); ctx.lineTo(ix + Math.cos(a) * len, iy + Math.sin(a) * len); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(ix, iy, 3 + age * 0.5, 0, Math.PI * 2); ctx.fill();
      } else if (splash.text === 'SAVED!') {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(ix, iy, 5 + age * 2.2, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ix, iy, 2 + age * 1.3, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + 0.3, d = 6 + age * 1.6; ctx.beginPath(); ctx.arc(ix + Math.cos(a) * d, iy + Math.sin(a) * d, 1.8, 0, Math.PI * 2); ctx.fill(); }
      } else {
        ctx.fillStyle = 'rgba(220,220,210,0.7)';
        for (let i = 0; i < 8; i++) { const a = hash(i + 7) * Math.PI * 2, d = 3 + age * (0.5 + hash(i + 90)); ctx.beginPath(); ctx.arc(ix + Math.cos(a) * d, iy + Math.sin(a) * d * 0.6 - age * 0.3, 2 + age * 0.08, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }

    // --- broadcast scorebug in the stands above the goal (two lines so nothing overflows the board)
    const jFlash = flashT > 0 && flashT % 10 < 5;
    rrect(ctx, 78, 4, 444, 64, 7); ctx.fillStyle = 'rgba(5,9,16,0.86)'; ctx.fill();
    ctx.save(); rrect(ctx, 78, 4, 444, 64, 7); ctx.clip();
    ctx.fillStyle = my.c1; ctx.fillRect(78, 4, 6, 64); ctx.fillStyle = my.c2; ctx.fillRect(84, 4, 3, 64);
    ctx.fillStyle = op.c1; ctx.fillRect(516, 4, 6, 64); ctx.fillStyle = op.c2; ctx.fillRect(513, 4, 3, 64);
    ctx.fillStyle = 'rgba(245,212,66,0.9)'; ctx.fillRect(78, 4, 444, 2);
    ctx.restore();
    rrect(ctx, 78, 4, 444, 64, 7); ctx.strokeStyle = jFlash ? '#ffffff' : 'rgba(245,212,66,0.75)'; ctx.lineWidth = jFlash ? 2.5 : 1.5; ctx.stroke();
    ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
    const cm = Math.floor(clockS / 60), cs = String(clockS % 60).padStart(2, '0');
    ctx.fillStyle = jFlash ? '#f5d442' : '#fff';
    ctx.fillText(my.id + ' 1 – 1 ' + op.id + '  ·  90+' + cm + ':' + cs + '  ·  KICK ' + kick + '/' + TOTAL_KICKS, CX, 22);
    ctx.font = 'bold 13px system-ui';
    ctx.fillText('SCORE ' + score.toLocaleString() +
      (wind ? '  ·  WIND ' + (wind > 0 ? '→' : '←') + Math.abs(Math.round(wind)) : ''), CX, 39);
    ctx.font = 'italic 11px system-ui';
    ctx.fillStyle = '#f5d442';
    ctx.fillText(comment, CX, 57);

    // --- score pop-ups (after the scorebug so they float over it)
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.t / 30);
      ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // --- aim HUD on a dark strip along the bottom
    if (phase === 'aim') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 397, W, 23);
      ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
      const sideTxt = spotX < -25 ? 'left channel' : spotX > 25 ? 'right channel' : 'dead center';
      ctx.fillText((isTouch() ? '' : '← → aim  ·  A/D curve  ·  hold Space  ·  ') + 'Curve ' + (curve >= 0 ? '↷ ' : '↶ ') + Math.abs(curve).toFixed(1) +
        '  ·  Power ' + Math.round(power) + '%  ·  ' + Math.round(24 * distF) + 'm out, ' + sideTxt, 10, 409);
      if (power > 88) { ctx.fillStyle = '#ff4400'; ctx.textAlign = 'right'; ctx.fillText('WILD!', 590, 409); }
    }

    // --- outcome stamp (goal or miss): banner slams in with a little overshoot, then breathes
    if (splash) {
      const age = 165 - splash.t;
      const a = splash.t > 151 ? age / 14 : splash.t < 24 ? splash.t / 24 : 1;
      const sc = splash.t > 151 ? 1.5 - 0.5 * (age / 14) : 1 + 0.03 * Math.sin(age * 0.25);
      ctx.save();
      ctx.translate(CX, 268); ctx.rotate(-0.06); ctx.scale(sc, sc); ctx.globalAlpha = a;
      ctx.font = '54px ' + STAMP_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = Math.min(560, ctx.measureText(splash.text).width + 48);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rrect(ctx, -tw / 2 + 4, -30 + 5, tw, 60, 8); ctx.fill();
      ctx.fillStyle = splash.color; rrect(ctx, -tw / 2, -30, tw, 60, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; rrect(ctx, -tw / 2 + 4, -26, tw - 8, 52, 6); ctx.stroke();
      ctx.fillStyle = '#0a1420'; ctx.fillText(splash.text, 0, 2);
      ctx.restore();
      ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
    }
    // goal flash
    if (flashT > 45) { ctx.fillStyle = 'rgba(255,255,255,' + ((flashT - 45) / 15 * 0.45).toFixed(3) + ')'; ctx.fillRect(-10, -10, W + 20, H + 20); }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // Fixed-step simulation: identical game speed at 60 / 120 / 144 Hz displays.
  const STEP_MS = 1000 / 60;
  let _acc = 0, _lastT = 0;
  function loop(now) {
    if (!_lastT) _lastT = now;
    _acc += Math.min(now - _lastT, 250);   // clamp long stalls (hidden tab) so we don't fast-forward
    _lastT = now;
    let n = 0;
    while (_acc >= STEP_MS && n < 4) { step(); _acc -= STEP_MS; n++; }
    if (n === 4) _acc = 0;
    draw();
    requestAnimationFrame(loop);
  }
  document.getElementById('restart').addEventListener('click', () => { grabFocus(); reset(); });
})();
</script>
</body>
</html>
